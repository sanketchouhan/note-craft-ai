name: notebook-lm

services:
  postgres:
    image: postgres:16
    container_name: notebook-lm-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notebook_lm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notebook_lm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
